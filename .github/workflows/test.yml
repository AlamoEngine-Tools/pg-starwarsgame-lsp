name: PG.StarWarsGame.LSP Build & Test

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# Least privilege for GITHUB_TOKEN. Every step here only READS the repository: checkout, restore,
# build, test, and two SBOM generations that upload their output as workflow artifacts rather than
# attaching it to a release. Without this block the token carries whatever the repository default
# grants, which on a public repo that takes pull requests is worth narrowing.
#
# NOTE for `workflow_call`: a called workflow cannot be granted more than its caller has, and this
# line now caps it regardless of the caller. If a future step needs to write - attaching an SBOM to
# a release, pushing a comment - it has to be added here deliberately.
permissions:
  contents: read

# A new push to a pull request makes the run for the previous push worthless; stop it. Pushes to
# master are never cancelled, so every master commit keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    name: Build & Test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    # The repo is checked out into a subfolder so the repositories it builds against (see
    # workspace.deps) have somewhere to sit beside it, exactly as on a developer machine.
    defaults:
      run:
        working-directory: PG.StarWarsGame.LSP

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        path: PG.StarWarsGame.LSP
        fetch-depth: 0

    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    # Both scripts on both operating systems, against local throwaway repositories. Runs before
    # the real setup so a broken script fails here, with a scenario name, rather than as a build
    # error further down.
    - name: Test the workspace setup scripts
      run: node --test scripts/workspace-setup.test.js

    # Windows runs the PowerShell script and Ubuntu the bash one, so every run exercises both on
    # the real repositories. On a pull request, owned repos (schema, baseline) with a branch named
    # like the PR's branch are built from it; on a push the name is empty and nothing matches.
    # The branch name reaches the scripts through the environment, never spliced into the command:
    # a pull request from a fork chooses its own branch name.
    - name: Set up workspace
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        MATCH_BRANCH: ${{ github.head_ref }}
      run: ./setup-workspace.ps1 -NoSelfUpdate -Groups build -MatchBranch $env:MATCH_BRANCH -Summary $env:GITHUB_STEP_SUMMARY

    - name: Set up workspace
      if: runner.os != 'Windows'
      env:
        MATCH_BRANCH: ${{ github.head_ref }}
      run: bash ./setup-workspace.sh --no-self-update --groups build --match-branch "$MATCH_BRANCH" --summary "$GITHUB_STEP_SUMMARY"

    - name: Build
      run: dotnet build PG.StarWarsGame.LSP.slnx --configuration Release

    # One SBOM per shippable artifact, not one per repo: the language server is a standalone
    # deliverable that could front any editor, so it and the VS Code extension are inventoried
    # separately. Runs AFTER the build on purpose - there are no packages.lock.json files here, so
    # Syft can only see NuGet dependencies through the *.deps.json emitted into bin/.
    # Ubuntu only: the matrix would otherwise produce two identical copies of each.
    # Production dependencies only, matching the server half, which is scanned from build output and
    # so describes what ships rather than the whole build closure. Installed clean into a separate
    # directory because the build itself needs its dev dependencies - scanning the extension folder
    # would sweep in esbuild, typescript and eslint, and a scanner reading that would flag CVEs in
    # build tooling no user ever receives.
    - name: Prepare the extension's production dependencies for SBOM scanning
      if: matrix.os == 'ubuntu-latest'
      run: |
        mkdir -p sbom-extension
        cp PG.StarWarsGame.LSP.Client.VSCode/aet-eaw-edit/package.json sbom-extension/
        cp PG.StarWarsGame.LSP.Client.VSCode/aet-eaw-edit/package-lock.json sbom-extension/
        cd sbom-extension && npm ci --omit=dev --ignore-scripts --no-audit --no-fund

    # Action inputs resolve against the workspace root, not the default working directory above,
    # hence the PG.StarWarsGame.LSP/ prefix on these paths.
    - name: Generate server SBOM
      if: matrix.os == 'ubuntu-latest'
      uses: anchore/sbom-action@v0
      with:
        path: PG.StarWarsGame.LSP/PG.StarWarsGame.LSP.Server/bin/Release
        format: spdx-json
        artifact-name: server.sbom.spdx.json
        output-file: server.sbom.spdx.json

    - name: Generate extension SBOM
      if: matrix.os == 'ubuntu-latest'
      uses: anchore/sbom-action@v0
      with:
        path: PG.StarWarsGame.LSP/sbom-extension
        format: spdx-json
        artifact-name: extension.sbom.spdx.json
        output-file: extension.sbom.spdx.json

    - name: Unit & Integration Tests
      # E2E tests require /foc (game data), which cannot be distributed, and /baseline (the e2e
      # group of workspace.deps), which this job does not set up.
      # Run each project individually - solution-wide run with all E2E tests filtered produces
      # exit code 8 (MTP ZeroTestsRan policy) even when all other tests pass.
      # xunit v3 + MTP uses --filter-not-trait, not --filter.
      # Every project runs even when an earlier one fails, so one run reports every failure; the
      # step fails at the end and names the projects that failed. bash on both runners (Git Bash
      # on Windows), so the loop is written once.
      shell: bash
      run: |
        failed=""
        for p in Core Schema Assets Xml Lua Lua.Debug Server Story; do
          echo "::group::$p tests"
          if ! dotnet test "PG.StarWarsGame.LSP.$p.Tests/PG.StarWarsGame.LSP.$p.Tests.csproj" --configuration Release --no-build --filter-not-trait "Category=E2E" --filter-not-trait "Category=FeatureCompleteness" --report-github; then
            failed="$failed $p"
          fi
          echo "::endgroup::"
        done
        if [ -n "$failed" ]; then
          echo "::error::Test projects failed:$failed"
          exit 1
        fi
