name: Release

# Step 2 of a release, after the bump PR from "Prepare Release" is merged. Run from the Actions tab
# on master. The version is read from the three version files, which must agree.
#
#   guard        version files agree, tag v<version> does not exist yet
#   test         the full test workflow; it also produces the two SBOMs
#   build        Windows: workspace, schema-release check, server publish + zip, VSIX
#   publish      ONE approval (environment "release") for everything public, all or nothing:
#                token check -> draft GitHub release -> Marketplace -> draft made public (tag)
#
# Replaces the publishing half of release.ps1; that script now only builds locally.

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Pre-release on GitHub and the Marketplace
        type: boolean
        default: false
      draft:
        description: GitHub draft only - Marketplace skipped
        type: boolean
        default: false
      skip_marketplace:
        description: GitHub release only - Marketplace skipped
        type: boolean
        default: false
      notes:
        description: Release notes - empty uses the generated notes
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  guard:
    name: Version guard
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Read the version
      id: version
      run: |
        version=$(node scripts/release-version.js check)
        if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
          echo "::error::v$version is already released - run Prepare Release for a new version first"
          exit 1
        fi
        echo "version=$version" >>"$GITHUB_OUTPUT"
        echo "Releasing v$version" >>"$GITHUB_STEP_SUMMARY"

  test:
    name: Test
    needs: guard
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  build:
    name: Build artifacts
    needs: [guard, test]
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.guard.outputs.version }}
    defaults:
      run:
        working-directory: PG.StarWarsGame.LSP
        shell: pwsh

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        path: PG.StarWarsGame.LSP
        fetch-depth: 0

    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Set up workspace
      run: ./setup-workspace.ps1 -NoSelfUpdate -Groups build -Summary $env:GITHUB_STEP_SUMMARY

    # Servers read the newest schema RELEASE, not schema main. A server built against a schema
    # version that is not released yet would ship and then resolve an older schema.
    - name: Check the schema is released
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $schema = (Get-Content schema/eaw/_index.json -Raw | ConvertFrom-Json).schemaVersion
        gh release view "v$schema" -R AlamoEngine-Tools/eaw-schema --json tagName | Out-Null
        if ($LASTEXITCODE -ne 0) {
          Write-Output "::error::Schema v$schema is not released - run Prepare Release and Release in eaw-schema first"
          exit 1
        }
        "Schema v$schema is released" | Add-Content $env:GITHUB_STEP_SUMMARY

    - name: Publish the server
      run: |
        dotnet publish PG.StarWarsGame.LSP.Server/PG.StarWarsGame.LSP.Server.csproj `
          --configuration Release --runtime win-x64 --self-contained true `
          -p:PublishSingleFile=true -p:DebugType=None --output dist/server
        if ($LASTEXITCODE -ne 0) { exit 1 }
        Compress-Archive -Path dist/server/* -DestinationPath "dist/PG.StarWarsGame.LSP.Server-$env:VERSION-win-x64.zip"

    - name: Package the extension
      working-directory: PG.StarWarsGame.LSP/PG.StarWarsGame.LSP.Client.VSCode/aet-eaw-edit
      run: |
        npm ci
        if ($LASTEXITCODE -ne 0) { exit 1 }
        $vsceArgs = @('package', '--no-dependencies', '--out', "../../dist/aet-eaw-edit-$env:VERSION.vsix")
        if ('${{ inputs.prerelease }}' -eq 'true') { $vsceArgs += '--pre-release' }
        npx --yes @vscode/vsce @vsceArgs
        if ($LASTEXITCODE -ne 0) { exit 1 }

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release-files
        path: |
          PG.StarWarsGame.LSP/dist/*.zip
          PG.StarWarsGame.LSP/dist/*.vsix
        if-no-files-found: error

  # Everything that becomes public, behind one approval and in an order that keeps it all or
  # nothing as far as two outside services allow:
  #   1. the Marketplace token is checked, so a bad token fails before anything exists
  #   2. the GitHub release is created as a DRAFT - invisible, and no tag yet
  #   3. the VSIX goes to the Marketplace - the one step that cannot be undone
  #   4. the draft is made public, which creates the tag
  # Any failure deletes the draft, so a failure before step 3 leaves nothing public. The only
  # partial state is step 4 failing after step 3; a re-run then skips the Marketplace (the version
  # is already there) and redoes steps 2 and 4.
  # The draft input stops after step 2; skip_marketplace leaves out steps 1 and 3.
  publish:
    name: Publish
    needs: [guard, build]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.guard.outputs.version }}
      TAG: v${{ needs.guard.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      MARKETPLACE: ${{ !inputs.draft && !inputs.skip_marketplace }}
      PRERELEASE: ${{ inputs.prerelease }}

    steps:
    - name: Checkout the changelog and the extension manifest
      uses: actions/checkout@v4
      with:
        sparse-checkout: |
          PG.StarWarsGame.LSP.Client.VSCode/aet-eaw-edit/CHANGELOG.md
          PG.StarWarsGame.LSP.Client.VSCode/aet-eaw-edit/package.json
        sparse-checkout-cone-mode: false
        path: repo

    - uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Extension id
      id: ext
      run: |
        manifest=repo/PG.StarWarsGame.LSP.Client.VSCode/aet-eaw-edit/package.json
        echo "publisher=$(jq -r .publisher "$manifest")" >>"$GITHUB_OUTPUT"
        echo "id=$(jq -r '.publisher + "." + .name' "$manifest")" >>"$GITHUB_OUTPUT"

    # vsce reads the token from VSCE_PAT.
    - name: Check the Marketplace token
      if: env.MARKETPLACE == 'true'
      env:
        VSCE_PAT: ${{ secrets.VSCE_PAT }}
      run: npx --yes @vscode/vsce verify-pat "${{ steps.ext.outputs.publisher }}"

    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: release-files
        path: files

    - name: Download SBOMs
      uses: actions/download-artifact@v4
      with:
        pattern: '*.sbom.spdx.json'
        path: sbom

    # Named after the artifact each SBOM describes, as release.ps1 did.
    - name: Name the SBOMs
      run: |
        cp "$(find sbom/server.sbom.spdx.json -type f -name '*.json' | head -n 1)" \
          "files/PG.StarWarsGame.LSP.Server-$VERSION-win-x64.sbom.spdx.json"
        cp "$(find sbom/extension.sbom.spdx.json -type f -name '*.json' | head -n 1)" \
          "files/aet-eaw-edit-$VERSION.sbom.spdx.json"
        ls -l files

    # Notes, first that exists: the notes input; the "## <version>" section of the extension's
    # CHANGELOG (the same text the Marketplace shows); GitHub's generated notes.
    # A draft left by an earlier failed run is replaced; a public release cannot get here, because
    # its tag would have stopped the guard.
    - name: Draft the GitHub release
      env:
        NOTES: ${{ inputs.notes }}
      run: |
        if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null)" = true ]; then
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
        fi
        args=(--repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --draft)
        [ "$PRERELEASE" = true ] && args+=(--prerelease)
        awk -v v="## $VERSION" '$0 == v { on = 1; next } /^## / { on = 0 } on' \
          repo/PG.StarWarsGame.LSP.Client.VSCode/aet-eaw-edit/CHANGELOG.md | tr -d '\r' >notes.md
        if [ -n "$NOTES" ]; then
          args+=(--notes "$NOTES")
        elif grep -q '[^[:space:]]' notes.md; then
          args+=(--notes-file notes.md)
        else
          echo "::warning::No '## $VERSION' section in CHANGELOG.md - using generated notes"
          args+=(--generate-notes)
        fi
        gh release create "$TAG" files/* "${args[@]}"

    - name: Publish to the Marketplace
      if: env.MARKETPLACE == 'true'
      env:
        VSCE_PAT: ${{ secrets.VSCE_PAT }}
      run: |
        published=$(npx --yes @vscode/vsce show "${{ steps.ext.outputs.id }}" --json | jq -r '.versions[].version')
        if grep -qx "$VERSION" <<<"$published"; then
          echo "::notice::$VERSION is already on the Marketplace - an earlier run published it"
          exit 0
        fi
        args=(publish --packagePath "files/aet-eaw-edit-$VERSION.vsix")
        [ "$PRERELEASE" = true ] && args+=(--pre-release)
        npx --yes @vscode/vsce "${args[@]}"

    - name: Make the GitHub release public
      if: ${{ !inputs.draft }}
      run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

    - name: Remove the draft
      if: failure()
      run: |
        if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null)" = true ]; then
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
          echo "::warning::Draft $TAG removed - nothing was made public on GitHub"
        fi
